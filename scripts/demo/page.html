<!doctype html>
<!-- One frame of the demo GIF: a made-up Claude window, its chat on the left and the pane on the
     right, drawn from the tree the pane returned. capture.mjs calls show() once per frame. -->
<html>
<head>
<meta charset="utf-8">
<style>
  /* The Tokyo Night skin from claude-skins (github.com/hellosverre/claude-skins): its text, muted
     and surface colours, on Tokyo Night's own backgrounds. */
  :root {
    --page: #16161e; --window: #1a1b26; --edge: #292e42; --line: #232433; --text: #c0caf5; --dim: #737aa2;
    --bubble: #24283b; --card: #1f2335; --field: #1f2335; --code: #292e42; --sunk: #16161e;
    --ok: #9ece6a; --err: #f7768e;
    --sans: -apple-system, "SF Pro Text", system-ui, sans-serif; --mono: "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1000px; height: 800px; overflow: hidden; background: var(--page); color: var(--text); font: 13px/20px var(--sans); -webkit-font-smoothing: antialiased; }
  .window { position: absolute; inset: 24px; border: 1px solid var(--edge); border-radius: 14px; background: var(--window); overflow: hidden; display: flex; flex-direction: column; }
  .bar { height: 38px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: var(--edge); display: inline-block; }
  .bar span { margin-left: 10px; }
  .main { flex: 1; display: flex; min-height: 0; }
  .chat { width: 484px; flex: none; border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 22px 26px 18px; gap: 11px; }
  .bubble { align-self: flex-end; max-width: 380px; background: var(--bubble); border-radius: 12px; padding: 9px 14px; margin-bottom: 6px; }
  .tool { display: flex; gap: 10px; align-items: baseline; color: var(--dim); }
  .tool b { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; transform: translateY(-1px); }
  .tool b.live { background: var(--dim); animation: none; }
  .tool code, .text code { font: 12.5px var(--mono); color: var(--text); }
  .text code { background: var(--code); border-radius: 4px; padding: 1px 4px; }
  .spacer { flex: 1; }
  .prompt { height: 52px; border: 1px solid var(--edge); border-radius: 12px; background: var(--field); display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 14px; color: var(--dim); }
  .prompt i { width: 28px; height: 28px; border-radius: 7px; background: var(--edge); display: grid; place-items: center; font-style: normal; color: var(--text); }
  .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .head { height: 46px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 14px; }
  .head span { color: var(--dim); font-size: 15px; letter-spacing: 6px; }
  .body { flex: 1; overflow: hidden; padding: 4px 16px 16px; }

  /* The plugin's elements. One cell of space is 8px across. */
  .Box { display: flex; position: relative; min-width: auto; }
  .Text { white-space: pre-wrap; }
  .Text.cut { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .Text.cut-start { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; min-width: 0; }
  .Button { display: inline-flex; align-items: center; background: none; border: 0; padding: 0; margin: 0; color: inherit; font: inherit; white-space: nowrap; overflow: hidden; min-width: 0; }
  .Input { height: 32px; flex: 1; display: flex; align-items: center; gap: 8px; border: 1px solid #80808033; border-radius: 9px; padding: 0 11px; color: var(--dim); background: #ffffff05; }
  .Svg { flex: none; display: block; }
  .Code { font: 11.5px/17px var(--mono); border: 1px solid #80808026; border-radius: 8px; background: var(--sunk); padding: 6px 0; overflow: hidden; }
  .Code div { padding: 0 10px; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  .Code .add { background: #9ece6a1c; color: var(--ok); }
  .Code .del { background: #f7768e1c; color: var(--err); }
  .Code .hunk { color: var(--dim); }
  .body { position: relative; }
  /* The person's press: the element lit, and a pointer on it. */
  .pressed { background: #6cb0f02e !important; border-radius: 7px; box-shadow: 0 0 0 1px #6cb0f066; }
  .pointer { position: absolute; width: 18px; height: 22px; pointer-events: none; z-index: 5; filter: drop-shadow(0 1px 2px #0009); }
</style>
</head>
<body>
<div class="window">
  <div class="bar"><i></i><i></i><i></i><span>weather-app</span></div>
  <div class="main">
    <div class="chat" id="chat"></div>
    <div class="pane">
      <div class="head">Files: weather-app<span>⤢✕</span></div>
      <div class="body" id="body"><div id="tree"></div></div>
    </div>
  </div>
</div>
<script>
const SPACE = { xs: 4, sm: 8, md: 12 }
const space = v => (v === undefined ? undefined : `${typeof v === 'number' ? v * 8 : SPACE[v] ?? 8}px`)
const TOKENS = { userMessageBackground: '#24283b', userMessageBackgroundHover: '#292e42' }
const color = v => TOKENS[v] ?? v
const SIZES = { footnote: '12px', caption: '11px', heading: '15px' }

let svgs = 0
// Each SVG inline, its ids made unique, its animations' begins shifted so the first is zero: the
// page's clock then sets every loop's phase (an inline SVG has a timeline of its own).
const inlineSvg = (source, width, height) => {
  const n = ++svgs
  let out = source.replace(/id="([^"]+)"/g, `id="$1_${n}"`).replace(/url\(#([^)]+)\)/g, `url(#$1_${n})`)
  const begins = [...out.matchAll(/begin="(-?[\d.]+)s"/g)].map(m => parseFloat(m[1]))
  if (begins.length) {
    const first = begins[0]
    out = out.replace(/begin="(-?[\d.]+)s"/g, (_, b) => `begin="${(parseFloat(b) - first).toFixed(3)}s"`)
  }
  const box = document.createElement('div')
  box.innerHTML = out
  const svg = box.firstElementChild
  svg.setAttribute('width', width)
  svg.setAttribute('height', height)
  svg.classList.add('Svg')
  svg.dataset.source = source.replace(/begin="[^"]*"/g, '')
  return svg
}

const textOf = node => (typeof node === 'string' ? node : (node.children ?? []).map(textOf).join(''))

const build = node => {
  if (typeof node === 'string') return document.createTextNode(node)
  const p = node.props ?? {}
  const kids = node.children ?? []
  let el

  switch (node.type) {
    case 'Box': {
      el = document.createElement('div')
      el.className = 'Box'
      const s = el.style
      s.flexDirection = p.flexDirection ?? 'row'
      if (p.alignItems) s.alignItems = p.alignItems
      if (p.justifyContent) s.justifyContent = p.justifyContent
      if (p.flexShrink !== undefined) s.flexShrink = p.flexShrink
      if (p.flexGrow !== undefined) s.flexGrow = p.flexGrow
      if (p.flexWrap) s.flexWrap = p.flexWrap
      if (p.minWidth !== undefined) s.minWidth = typeof p.minWidth === 'number' ? `${p.minWidth * 8}px` : p.minWidth
      const column = p.flexDirection === 'column'
      if (p.gap !== undefined) s.gap = column ? (p.gap === 1 ? '8px' : space(p.gap)) : space(p.gap)
      if (p.rowGap !== undefined) s.rowGap = space(p.rowGap)
      if (p.columnGap !== undefined) s.columnGap = space(p.columnGap)
      const pad = (k, css) => p[k] !== undefined && (s[css] = space(p[k]))
      pad('padding', 'padding')
      if (p.paddingX !== undefined) s.paddingLeft = s.paddingRight = space(p.paddingX)
      if (p.paddingY !== undefined) s.paddingTop = s.paddingBottom = space(p.paddingY)
      pad('paddingLeft', 'paddingLeft')
      pad('marginTop', 'marginTop')
      if (p.overflow === 'hidden') s.overflow = 'hidden'
      if (p.backgroundColor) s.background = color(p.backgroundColor)
      const key = p.key ?? ''
      if (key) el.dataset.key = key
      if (p.borderStyle) {
        s.border = `1px solid ${color(p.borderColor ?? '#8080802e')}`
        s.borderRadius = key.startsWith('row:') ? '7px' : column ? '13px' : '999px'
      }
      // A card pads itself a little more than one cell, as the desktop does.
      if (p.borderStyle && column) { s.padding = '14px 16px' }
      if (key.startsWith('row:')) { s.paddingTop = s.paddingBottom = '1px'; s.paddingLeft = s.paddingRight = '8px' }
      if (key.startsWith('chip:')) { s.padding = '1px 8px' }
      if (p.position === 'absolute') {
        s.position = 'absolute'
        s.top = `${(p.top ?? 0) * 8}px`; s.left = `${(p.left ?? 0) * 8}px`
        if (p.right !== undefined) s.right = `${p.right * 8}px`
        if (p.bottom !== undefined) s.bottom = `${p.bottom * 8}px`
      }
      if (p.width !== undefined) s.width = typeof p.width === 'number' ? `${p.width * 8}px` : p.width
      // The tree's indent, a level a cell and a half, as the desktop draws it.
      if (p.paddingLeft !== undefined && typeof p.paddingLeft === 'number') s.paddingLeft = `${p.paddingLeft * 9}px`
      break
    }
    case 'Text': {
      el = document.createElement('span')
      el.className = 'Text'
      if (p.wrap === 'truncate-end') el.classList.add('cut')
      if (p.wrap === 'truncate-start') el.classList.add('cut-start')
      const s = el.style
      if (p.color) s.color = color(p.color)
      if (p.dimColor) s.color = p.color ? color(p.color) : 'var(--dim)'
      if (p.dimColor && p.color) s.opacity = 0.75
      if (p.bold || p.weight === 'bold') s.fontWeight = 700
      if (p.weight === 'semibold') s.fontWeight = 600
      if (p.italic) s.fontStyle = 'italic'
      if (p.mono) s.fontFamily = 'var(--mono)'
      if (p.tabular) s.fontVariantNumeric = 'tabular-nums'
      if (p.size) { s.fontSize = SIZES[p.size]; if (p.size === 'heading') s.lineHeight = '22px'; if (p.size === 'caption') { s.letterSpacing = '0.02em' } }
      if (p.backgroundColor) s.background = color(p.backgroundColor)
      break
    }
    case 'Code': {
      el = document.createElement('div')
      el.className = 'Code'
      for (const line of (p.source ?? '').split('\n')) {
        const row = document.createElement('div')
        row.className = line.startsWith('@@') ? 'hunk' : line.startsWith('+') ? 'add' : line.startsWith('-') ? 'del' : ''
        row.textContent = line || ' '
        el.append(row)
      }
      return el
    }
    case 'Button': {
      el = document.createElement('span')
      el.className = 'Button'
      if (p.key) el.dataset.key = p.key
      if (p.dimColor) el.style.color = 'var(--dim)'
      if (!kids.length && p.label) el.textContent = p.label
      break
    }
    case 'Input': {
      el = document.createElement('div')
      el.className = 'Input'
      el.innerHTML = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#737aa2" stroke-width="1.6"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5" stroke-linecap="round"/></svg>'
      el.append(p.value || p.placeholder || '')
      return el
    }
    case 'Svg': {
      const svg = inlineSvg(p.source, p.width ?? 16, p.height ?? 16)
      if (p.alt) svg.setAttribute('aria-label', p.alt)
      return svg
    }
    default:
      el = document.createElement('div')
  }

  for (const kid of kids) el.append(build(kid))
  return el
}

const CODE = /(`[^`]+`|\b[\w./-]+\.(?:ts|tsx|js)\b)/g
const chatHtml = chat =>
  chat.map(one => {
    if (one.kind === 'user') return `<div class="bubble">${one.text}</div>`
    if (one.kind === 'tool') return `<div class="tool"><b class="${one.isLive ? 'live' : ''}"></b><span>${one.verb} <code>${one.detail.replace(/</g, '&lt;')}</code></span></div>`
    return `<div class="text">${(one.text ?? '').replace(CODE, m => `<code>${m.replace(/`/g, '')}</code>`)}</div>`
  }).join('') + '<div class="spacer"></div><div class="prompt">Reply to Claude…<i>↑</i></div>'

// Where each SVG first showed, so a check that draws itself plays from its own start.
const firstSeen = new Map()
let scrollTop = 0

window.show = (frame, tree) => {
  svgs = 0
  document.getElementById('chat').innerHTML = chatHtml(frame.chat)
  const root = document.getElementById('tree')
  root.replaceChildren(build(tree))

  const t = frame.time / 1000
  for (const svg of root.querySelectorAll('svg.Svg')) {
    const key = svg.dataset.source
    if (!firstSeen.has(key)) firstSeen.set(key, t)
    svg.pauseAnimations()
    svg.setCurrentTime(svg.innerHTML.includes('fill="freeze"') ? t - firstSeen.get(key) + 0.15 : t)
  }

  // The pane follows the file Claude has in hand, as the plugin's reveal does: the row with the
  // shimmer, brought into sight a little at a time.
  const body = document.getElementById('body')
  const rows = [...root.querySelectorAll('.Box')].filter(el => el.style.borderRadius === '7px')
  // A press the person makes: lit, a pointer on it, and the pane brought to it like a live row.
  // A press on a row lands on the button laid over it: the row is what lights.
  const pressed = frame.press ? root.querySelector(`[data-key="${CSS.escape(frame.press)}"]`) : null
  const lit = pressed && (pressed.closest('[data-key^="row:"]') ?? pressed)
  if (lit) lit.classList.add('pressed')
  const target = lit ?? rows.find(row => row.querySelector('svg.Svg[aria-label="working"]'))
  let want = scrollTop
  if (target) {
    // Measured against the whole tree: a row's offsetTop counts from the folder box it sits in.
    const top = target.getBoundingClientRect().top - root.getBoundingClientRect().top, bottom = top + target.offsetHeight
    const view = body.clientHeight - 24
    if (bottom > scrollTop + view) want = bottom - view
    if (top < scrollTop) want = top - 8
  }
  scrollTop += Math.max(-40, Math.min(40, want - scrollTop))
  body.scrollTop = scrollTop

  body.querySelector('.pointer')?.remove()
  if (lit) {
    const box = (pressed.closest('[data-key^="row:"]') ? pressed.closest('[data-key^="row:"]').querySelector('.Text') ?? pressed : pressed).getBoundingClientRect()
    const at = body.getBoundingClientRect()
    const pointer = document.createElement('div')
    pointer.className = 'pointer'
    pointer.innerHTML = '<svg width="18" height="22" viewBox="0 0 18 22"><path d="M2 1.5v16.5l4.3-4.1 2.9 6.6 2.9-1.3-2.9-6.5h6.1z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg>'
    pointer.style.left = `${box.left - at.left + Math.min(box.width / 2, 40)}px`
    pointer.style.top = `${box.top - at.top + body.scrollTop + box.height / 2 - 2}px`
    body.append(pointer)
  }
  return true
}
</script>
</body>
</html>
