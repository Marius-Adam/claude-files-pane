# Keeps the workflow's pinned actions current, in one pull request a week to staging, as the README
# asks. It takes effect once it reaches main, with the next release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
