# Validates the mod and runs its tests on every push and pull request, on macOS, Linux and Windows,
# and keeps main fed only from staging. Validation and tests run without a login.
# Type-checking needs the API types Claude Code writes when it loads the mod, so it stays local:
# `npx -p typescript tsc -p . --noEmit` (see the README's Develop section).
name: Check

on:
  push:
    branches: [main, staging]
  pull_request:

# Nothing here writes to the repository, so the token gets read access only.
permissions:
  contents: read

jobs:
  test:
    strategy:
      # One system failing still lets the others finish, so a run says which ones break.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        claude-code: [latest]
        include:
          # The oldest Claude Code the mod loads on: 2.1.296 and older fail to load its hooks module,
          # so the pane never appears. Raise it with the README's Prerequisites when a change needs
          # a newer one.
          - os: ubuntu-latest
            claude-code: 2.1.299
    runs-on: ${{ matrix.os }}
    env:
      # The version installed is the one tested: it does not update itself during the run.
      DISABLE_AUTOUPDATER: 1
    steps:
      # Actions are pinned to a commit, as a tag can be moved; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token is not left in the clone's git config.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@${{ matrix.claude-code }}
      - name: Validate the mod
        run: claude plugin validate .
      - name: Run the tests
        run: claude plugin test .

  # The rulesets on staging and main require a check named `check`: this one reports the matrix's
  # result under that name, so a system added to or dropped from the matrix needs no ruleset change.
  # `always()` keeps it from being skipped when a system fails, as a skipped check counts as passed.
  check:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Pass only when every system passed
        env:
          RESULT: ${{ needs.test.result }}
        run: '[ "$RESULT" = success ]'

  # A release is one pull request from staging to main, so a pull request into main from any other
  # branch, or from a fork's staging, fails here. Main's ruleset requires this check.
  from-staging:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Come from this repository's staging
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != staging ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Pull requests into main come from staging. Open this one against staging instead."
            exit 1
          fi
