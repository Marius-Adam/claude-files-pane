# Temporary, dropped before merge: Open in on a real Windows host, with VS Code installed.
name: Windows Open in smoke

on: pull_request

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install VS Code
        run: |
          choco install vscode -y --no-progress
          "C:\Program Files\Microsoft VS Code\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # `claude-code` is the engine's own module; the smoke needs none of what disk.ts takes from it.
      - name: Install tsx, and a stand-in for the engine's module
        run: |
          npm install --no-save tsx@4.19.2
          New-Item -ItemType Directory -Force node_modules/claude-code | Out-Null
          '{ "name": "claude-code", "main": "index.js" }' | Set-Content node_modules/claude-code/package.json
          'exports.atom = () => ({}); exports.read = () => undefined; exports.update = () => undefined' | Set-Content node_modules/claude-code/index.js
      - name: Find VS Code and open a file in it, as the pane does
        run: node --import tsx .github/smoke/open-in.ts
